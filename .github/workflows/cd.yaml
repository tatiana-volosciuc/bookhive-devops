name: CD

on:
  release:
    types: [published]
  workflow_dispatch:            # redeploy or roll back to any existing tag
    inputs:
      tag:
        description: Release tag to deploy (e.g. v1.2.3)
        required: true
      environment:
        description: Target environment
        type: choice
        options: [ dev, production ]
        default: dev

permissions:
  id-token: write               # lets the job request an OIDC token
  contents: read
  actions: read                 # needed to check CI status

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'dev' || 'production') || inputs.environment }}
    concurrency:
        group: deploy-${{ github.event_name == 'release' && (github.event.release.prerelease && 'dev' || 'production') || inputs.environment }}
        cancel-in-progress: false
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "Tag $TAG is not on main"; exit 1; }

      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --workflow CI --commit "$(git rev-parse HEAD)" \
                --status success --json conclusion --jq 'length')
          [ "$n" -gt 0 ] || { echo "No successful CI run for this commit"; exit 1; }

      - name: Debug OIDC subject
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const p = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(JSON.stringify({
              sub: p.sub,
              aud: p.aud,
              repository: p.repository,
              environment: p.environment
            }, null, 2));

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push PHP image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ECR_REPOSITORY }}:${{ env.TAG }}
          cache-from: type=gha,scope=php
          cache-to: type=gha,mode=max,scope=php

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/nginx
          push: true
          tags: |
            ${{ vars.ECR_NGINX_REPOSITORY }}:${{ env.TAG }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_FAMILY }} \
            --query taskDefinition \
            > task-definition.json

      - name: Fill in new PHP image ID
        id: task-def-php
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: bookhive
          image: ${{ vars.ECR_REPOSITORY }}:${{ env.TAG }}

      - name: Fill in new nginx image ID
        id: task-def-nginx
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-php.outputs.task-definition }}
          container-name: nginx
          image: ${{ vars.ECR_NGINX_REPOSITORY }}:${{ env.TAG }}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-nginx.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
