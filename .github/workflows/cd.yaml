name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code at the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push PHP image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ECR_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=php
          cache-to: type=gha,mode=max,scope=php

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/nginx
          push: true
          tags: |
               ${{ vars.ECR_NGINX_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
          --task-definition bookhive-app \
          --query taskDefinition \
          > task-definition.json

      - name: Fill in new PHP image ID
        id: task-def-php
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: bookhive
          image: ${{ vars.ECR_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}

      - name: Fill in new nginx image ID
        id: task-def-nginx
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-php.outputs.task-definition }}
          container-name: nginx
          image: ${{ vars.ECR_NGINX_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-nginx.outputs.task-definition }}
          service: bookhive-service
          cluster: bookhive-cluster
          wait-for-service-stability: true
