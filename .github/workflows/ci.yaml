name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bookhive:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d \
            -p 8080:8000 \
            --name bookhive-ci \
            --entrypoint php \
            bookhive:ci-${{ github.sha }} \
            -S 0.0.0.0:8000 -t public public/index.php

      - name: Wait for container to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "Container is up"
              exit 0
            fi
            echo "Waiting for container... ($i/15)"
            sleep 2
          done
          echo "Container never became ready"
          docker logs bookhive-ci
          exit 1

      - name: Verify health endpoint
        run: |
          response=$(curl -sf http://localhost:8080/health)
          echo "Health response: $response"
          echo "$response" | grep -q '"status":"ok"' || (echo "Health check did not return ok" && exit 1)

      - name: Verify container runs as non-root
        run: |
          user=$(docker exec bookhive-ci whoami)
          echo "Container user: $user"
          if [ "$user" = "root" ]; then
            echo "Container is running as root — expected non-root user"
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker logs bookhive-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f bookhive-ci || true
