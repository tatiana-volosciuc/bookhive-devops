# Uses its own Secret so the cron can run with narrower credentials than the app
# (e.g. an S3 key limited to this bucket, a DB user with only SELECT on author).
# Create it first, with the same keys as app-secret:
#   kubectl create secret generic cron-secret `
#     --from-literal=DB_NAME=... --from-literal=DB_USER=... --from-literal=DB_PASSWORD=... `
#     --from-literal=AWS_REGION=... --from-literal=AWS_ACCESS_KEY_ID=... `
#     --from-literal=AWS_SECRET_ACCESS_KEY=... --from-literal=AWS_S3_BUCKET=...
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-orphan-photos
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: wait-for-mysql
              image: busybox:1.36
              command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"]
          containers:
            - name: cleanup-orphan-photos
              image: symfony-php:1.0
              imagePullPolicy: IfNotPresent
              # Overriding `command` bypasses the image entrypoint, so the job doesn't run migrations.
              # Remove "--dry-run" to actually delete files.
              command: ["php", "bin/console", "app:cleanup-orphan-photos", "--min-age-hours=24", "--dry-run"]
              envFrom:
                - secretRef:
                    name: cron-secret   # same keys as app-secret; create it first (see comment above)
              env:
                - name: APP_ENV
                  value: dev
                - name: DATABASE_URL
                  value: mysql://$(DB_USER):$(DB_PASSWORD)@mysql:3306/$(DB_NAME)?serverVersion=8.0
