apiVersion: apps/v1
kind: Deployment
metadata:
  name: php
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php
  template:
    metadata:
      labels:
        app: php
    spec:
      initContainers:           # replaces depends_on: service_healthy
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"]
      containers:
        - name: php
          image: symfony-php:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          envFrom:
            - secretRef:
                name: app-secret      # DB_*, AWS_* from your .env
          env:
            - name: APP_ENV
              value: dev
            - name: DATABASE_URL
              value: mysql://$(DB_USER):$(DB_PASSWORD)@mysql:3306/$(DB_NAME)?serverVersion=8.0
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: php
spec:
  type: ClusterIP
  selector:
    app: php
  ports:
    - port: 9000
      targetPort: 9000
