# Symfony front-controller setup for ECS (php-fpm in the same task).
# The compose file keeps using docker/nginx/default.conf (php:9000);
# this one is only baked into the image built from docker/nginx/Dockerfile.

# TLS ends at the ALB; tell PHP the original request was HTTPS.
map $http_x_forwarded_proto $fcgi_https {
    default "";
    https   on;
}

server {
    listen 80;
    server_name _;

    # php-fpm has the real files; nginx only needs the path to exist in the
    # fastcgi params, so nothing has to be copied into this image.
    root /var/www/html/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param HTTPS           $fcgi_https if_not_empty;

        # ALB idle timeout is 60s; keep PHP's wait just under it
        fastcgi_read_timeout 55s;
        internal;
    }

    # Never execute any other .php file
    location ~ \.php$ {
        return 404;
    }
}
