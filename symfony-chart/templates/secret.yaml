apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  DB_NAME: {{ required "db.name is required" .Values.db.name | quote }}
  DB_USER: {{ required "db.user is required" .Values.db.user | quote }}
  DB_PASSWORD: {{ required "db.password is required" .Values.db.password | quote }}
  AWS_REGION: {{ .Values.aws.region | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.aws.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.aws.secretAccessKey | quote }}
  AWS_S3_BUCKET: {{ .Values.aws.bucket | quote }}
