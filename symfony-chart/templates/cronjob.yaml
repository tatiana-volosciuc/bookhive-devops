{{- if .Values.healthCheck.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: health-check
spec:
  schedule: {{ .Values.healthCheck.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: health-check
              image: busybox:1.36
              command: ["sh", "-c", "wget -q -T 10 -O - http://nginx/health"]
{{- end }}
