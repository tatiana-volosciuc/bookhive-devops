{{- if .Values.cleanup.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: cron-secret
type: Opaque
stringData:
  # Cron-specific credentials; each falls back to the app's value when left empty.
  DB_NAME: {{ .Values.db.name | quote }}
  DB_USER: {{ default .Values.db.user .Values.cleanup.db.user | quote }}
  DB_PASSWORD: {{ default .Values.db.password .Values.cleanup.db.password | quote }}
  AWS_REGION: {{ .Values.aws.region | quote }}
  AWS_ACCESS_KEY_ID: {{ default .Values.aws.accessKeyId .Values.cleanup.aws.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ default .Values.aws.secretAccessKey .Values.cleanup.aws.secretAccessKey | quote }}
  AWS_S3_BUCKET: {{ .Values.aws.bucket | quote }}
{{- end }}
