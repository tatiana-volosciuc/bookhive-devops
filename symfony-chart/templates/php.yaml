apiVersion: apps/v1
kind: Deployment
metadata:
  name: php
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php
  template:
    metadata:
      labels:
        app: php
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- if .Values.php.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.php.imagePullSecret | quote }}
      {{- end }}
      initContainers:           # replaces depends_on: service_healthy
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z \"$DB_HOST\" 3306; do echo waiting for mysql; sleep 2; done"]
          env:
            - name: DB_HOST
              value: {{ .Values.db.host | quote }}
      containers:
        - name: php
          image: {{ .Values.php.image }}:{{ .Values.php.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          envFrom:
            - secretRef:
                name: {{ default "app-secret" .Values.db.existingSecret | quote }}
          env:
            - name: APP_ENV
              value: {{ .Values.php.appEnv | quote }}
            - name: DB_HOST
              value: {{ .Values.db.host | quote }}
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            - name: AWS_S3_BUCKET
              value: {{ .Values.aws.bucket | quote }}
            {{- if not .Values.db.existingSecret }}
            - name: DATABASE_URL
              value: mysql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):3306/$(DB_NAME)?serverVersion=8.0
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
