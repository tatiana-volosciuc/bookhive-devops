php:
    image: symfony-php
    tag: "1.0"
    appEnv: dev
    imagePullSecret: ""

nginx:
    nodePort: 30080

mysql:
    enabled: true
    storage: 5Gi

db:
    host: mysql
    existingSecret: ""
    name: ""
    user: ""
    password: ""

aws:
    region: ""
    accessKeyId: ""
    secretAccessKey: ""
    bucket: ""

healthCheck:
    enabled: true
    schedule: "*/5 * * * *"

cleanup:
    enabled: true
    schedule: "0 3 * * *"
    minAgeHours: 24
    dryRun: true
    # Optional cron-only credentials; empty values fall back to the app's db.* / aws.*
    db:
        user: ""
        password: ""
    aws:
        accessKeyId: ""
        secretAccessKey: ""

ingress:
    enabled: true
    className: traefik
    host: myapp.local
